server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite가 파일명에 해시를 붙이는 정적 자산은 장기간 캐시해도 안전하다.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 브라우저의 /api 요청에서 접두사를 제거하고 Docker 내부 백엔드로 전달한다.
    # proxy_pass 끝의 /가 /api/를 /로 치환하므로 실제 백엔드 API 경로가 유지된다.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 백엔드의 Refresh Token 쿠키를 브라우저가 /api/auth 요청에 전송하도록 맞춘다.
        proxy_cookie_path /auth /api/auth;
    }

    # React Router 경로를 직접 열거나 새로고침해도 index.html에서 라우팅을 시작한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
