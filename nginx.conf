server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 내부 DNS를 사용해 재생성된 백엔드 컨테이너의 IP를 다시 조회한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # proxy_pass에서 변수를 사용해야 resolver의 DNS 갱신 결과가 반영된다.
    set $backend_upstream backend:8080;

    # Vite가 파일명에 해시를 붙이는 정적 자산은 장기간 캐시해도 안전하다.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 브라우저의 /api 요청에서 접두사를 제거하고 Docker 내부 백엔드로 전달한다.
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 백엔드의 Refresh Token 쿠키를 브라우저가 /api/auth 요청에 전송하도록 맞춘다.
        proxy_cookie_path /auth /api/auth;
    }

    # React Router 경로를 직접 열거나 새로고침해도 index.html에서 라우팅을 시작한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
